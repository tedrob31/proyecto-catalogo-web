version: "3.7"
services:

## --------------------------- BACKEND API (Manager) --------------------------- ##
  backend_api:
    image: ghcr.io/tedrob31/proyecto-catalogo-web:main
    build: 
      context: .
      dockerfile: Dockerfile
      target: runner
    networks:
      - r4tlabsnet
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # ADMIN CREDENTIALS (Load from environment)
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password123}
      # GOOGLE DRIVE CREDENTIALS
      - DRIVE_CREDENTIALS_PATH=/app/cache/credentials.json
      - DRIVE_CATALOG_FOLDER_ID=${DRIVE_CATALOG_FOLDER_ID}
      - DRIVE_COVERS_FOLDER_ID=${DRIVE_COVERS_FOLDER_ID}
      - DATA_DIR=/app/cache
      - IMAGES_DIR=/app/public/images
      - DATABASE_URL=file:/app/cache/local.db
      # Cloudflare Cache Purge (Optional)
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      # Domain for Metadata (SSG)
      - NEXT_PUBLIC_DOMAIN_NAME=${DOMAIN_NAME:-r4tlabs.com}
      - NEXT_PUBLIC_IMAGE_URL=https://img.${DOMAIN_NAME:-r4tlabs.com} # O la URL estática
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-liquidacion_catalogodemoda}
      # Performance Tuning
      - NODE_OPTIONS='--max-old-space-size=2048'
    volumes:
      - catalog_cache:/app/cache
      - catalog_images:/app/public/images
      - catalog_out:/app/out
    healthcheck:
      # Ajustamos el healthcheck a la ruta principal del admin o api
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
      labels:
        - traefik.enable=true
        - traefik.docker.network=r4tlabsnet
        
        # Router unificado para todo lo dinámico con prioridad máxima
        - "traefik.http.routers.r4t-backend-${COMPOSE_PROJECT_NAME:-catsite}.rule=(Host(`${DOMAIN_NAME:-r4tlabs.com}`) || Host(`www.${DOMAIN_NAME:-r4tlabs.com}`)) && (PathPrefix(`/modaaadmin`) || PathPrefix(`/api`) || PathPrefix(`/_next`))"
        - "traefik.http.routers.r4t-backend-${COMPOSE_PROJECT_NAME:-catsite}.priority=50000"
        - "traefik.http.routers.r4t-backend-${COMPOSE_PROJECT_NAME:-catsite}.entrypoints=websecure"
        - "traefik.http.routers.r4t-backend-${COMPOSE_PROJECT_NAME:-catsite}.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.r4t-backend-${COMPOSE_PROJECT_NAME:-catsite}.service=backend_api-${COMPOSE_PROJECT_NAME:-catsite}"
        - "traefik.http.services.backend_api-${COMPOSE_PROJECT_NAME:-catsite}.loadbalancer.server.port=3000"

## --------------------------- STATIC SERVER (Nginx) --------------------------- ##
  static_server:
    image: nginx:alpine
    networks:
      - r4tlabsnet
    volumes:
      - catalog_images:/usr/share/nginx/html/catalog:ro
      - catalog_out:/usr/share/nginx/html
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.docker.network=r4tlabsnet
        
        # REGLA DE EXCLUSIÓN: Nginx solo responde si NO es una ruta de backend
        - "traefik.http.routers.r4t-static-${COMPOSE_PROJECT_NAME:-catsite}.rule=(Host(`${DOMAIN_NAME:-r4tlabs.com}`) || Host(`www.${DOMAIN_NAME:-r4tlabs.com}`)) && !PathPrefix(`/modaaadmin`) && !PathPrefix(`/api`) && !PathPrefix(`/_next`)"
        - "traefik.http.routers.r4t-static-${COMPOSE_PROJECT_NAME:-catsite}.priority=1000"
        - "traefik.http.routers.r4t-static-${COMPOSE_PROJECT_NAME:-catsite}.entrypoints=websecure"
        - "traefik.http.routers.r4t-static-${COMPOSE_PROJECT_NAME:-catsite}.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.r4t-static-${COMPOSE_PROJECT_NAME:-catsite}.service=static_server-${COMPOSE_PROJECT_NAME:-catsite}"
        - "traefik.http.services.static_server-${COMPOSE_PROJECT_NAME:-catsite}.loadbalancer.server.port=80"

## --------------------------- VOLUMES & NETWORKS --------------------------- ##

volumes:
  catalog_cache:
    name: ${COMPOSE_PROJECT_NAME:-catsite}_cache
  catalog_images:
    name: ${COMPOSE_PROJECT_NAME:-catsite}_images
  catalog_out:
    name: ${COMPOSE_PROJECT_NAME:-catsite}_out

networks:
  r4tlabsnet:
    external: true
    name: r4tlabsnet

configs:
  nginx_conf:
    file: ./nginx/nginx.conf
