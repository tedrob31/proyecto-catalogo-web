server {
    listen 8080;
    server_name localhost;

    # Serve catalog images
    location /catalog/ {
        alias /usr/share/nginx/html/catalog/;
        
        # Optimize for static file serving
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Add CORS headers if necessary (since Cloudflare might need it)
        add_header 'Access-Control-Allow-Origin' '*';

        # Cache headers for Cloudflare to pick up
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve cover images
    location /covers/ {
        alias /usr/share/nginx/html/covers/;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
